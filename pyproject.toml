[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "life-admin-autopilot"
version = "0.1.0"
description = "Personal operations agent: turns receipts, subscriptions, warranties, and appointments into prioritized tasks"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=0.1.0",
    "PyPDF2>=3.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "openai>=1.40.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr = ["pdf2image>=1.16.0", "pytesseract>=0.3.10"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
